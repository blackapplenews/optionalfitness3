<!DOCTYPE html>

<head>

    <title>World Star Fitness Club</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <style>
        /* General Styles */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #333;
        }
        .logo img {
    max-width: 150px;
}

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1, h2, h3,p {
            color: #ffffff;
            font-size: 2em;
        }

        a {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #2980b9;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
        }

        /* Header Styles */
        .main-header {
            background: linear-gradient(90deg, #ff5733, #c70039);
            color: #fff;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .main-header img {
            max-width: 100px;
            margin: 10px auto;
        }

        .main-header h1 {
            font-size: 3em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .nav-list {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 0;
        }

        .nav-list li {
            margin: 0 15px;
        }

        .nav-list a {
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
        }

        .nav-list a:hover {
            color: #f1c40f;
        }

        .social-top {
            text-align: center;
            margin-top: 10px;
        }

        .social-top a {
            margin: 0 10px;
            color: #fff;
            font-size: 1.2em;
        }

        .social-top a:hover {
            color: #f1c40f;
        }

        /* Hero Section */
        .hero-section {
            background: url('hero-bg.jpg') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            padding: 100px 20px;
        }

        .hero-section h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .image-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .image-row img {
            width: 18%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-row img:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
        }

        /* Footer */
        .main-footer {
            background: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        .main-footer p {
            margin: 0;
        }

        .social-links a {
            margin: 0 10px;
            color: #fff;
            font-size: 1.5em;
        }

        .social-links a:hover {
            color: #f1c40f;
        }

        @media (max-width: 768px) {
            .image-row img {
                width: 45%;
            }
        }
    </style>
</head>
